name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bisect builds below check out older commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      # TEMPORARY regression hunt (Tekken 3 select-screen artifacts): older
      # builds side by side under /bisect/<commit>/ - remove when found
      - name: Bisect builds
        run: |
          for c in eb2a2f5 bafd774 6800682; do
            git worktree add "/tmp/b-$c" "$c"
            ln -s "$PWD/node_modules" "/tmp/b-$c/node_modules"
            (cd "/tmp/b-$c" && NODE_ENV=production PUBLIC_PATH="/PSX-emu-JS/bisect/$c/" npx webpack)
            mkdir -p dist/bisect
            cp -r "/tmp/b-$c/dist" "dist/bisect/$c"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
